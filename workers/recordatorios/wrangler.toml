# Worker con cron para los recordatorios de Amelia Nail Spa (ver docs/plataforma/CONFIGURACION.md §13).
name = "amelia-recordatorios"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["*/15 * * * *"]   # cada 15 minutos (UTC; la lógica usa hora de Colombia)

# La MISMA base que la página (copiar el database_id real de ../../wrangler.toml).
[[d1_databases]]
binding = "DB"
database_name = "amelia-citas"
database_id = "426435a8-c159-4f56-9b7d-a7ea37f9df1d"

# Secretos (no van aquí): VAPID_PUBLICA, VAPID_PRIVADA, VAPID_SUJETO
#   npx wrangler secret put VAPID_PRIVADA --config workers/recordatorios/wrangler.toml

# Opcional: bucket R2 para guardar las copias de seguridad diarias fuera de la base (recomendado).
#   npx wrangler r2 bucket create amelia-respaldos
# y quitar el comentario:
# [[r2_buckets]]
# binding = "RESPALDOS"
# bucket_name = "amelia-respaldos"

# Opcional (recomendado mientras no haya R2): copia diaria fuera de la base en un espacio KV.
#   npx wrangler kv namespace create amelia-respaldos   → copiar el id aquí y quitar el comentario:
# [[kv_namespaces]]
# binding = "RESPALDOS_KV"
# id = "<id del espacio KV>"
