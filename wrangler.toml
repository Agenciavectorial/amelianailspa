# Cloudflare Pages: Amelia Nail Spa (página + plataforma de citas).
# Sitio estático en public/ (sin paso de build) y funciones en functions/.
name = "amelianailspa"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# La base de datos D1 de citas y los secretos se agregan con la plataforma de citas
# (los secretos van en el panel de Cloudflare, nunca en el repositorio).

# Base de datos de la plataforma de citas (ver docs/plataforma/CONFIGURACION.md).
# Base D1 real de la plataforma (el ID no es secreto).
# En desarrollo local wrangler usa una copia local de esta base.
[[d1_databases]]
binding = "DB"
database_name = "amelia-citas"
database_id = "426435a8-c159-4f56-9b7d-a7ea37f9df1d"
migrations_dir = "migrations"
